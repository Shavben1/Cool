<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova · AI Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="chat-card" aria-labelledby="chatTitle">
        <header class="chat-header">
            <div>
                <h1 id="chatTitle">Nova</h1>
                <p class="chat-subtitle">Your curious, always-on AI companion</p>
            </div>
            <div class="status-indicator" role="status" aria-live="polite">
                <span class="status-dot" aria-hidden="true"></span>
                Online
            </div>
        </header>

        <section id="chatLog" class="chat-log" role="log" aria-live="polite" aria-label="Conversation"></section>

        <div class="suggestions" aria-label="Quick prompt suggestions">
            <button type="button" class="suggestion" data-message="Give me a productivity tip.">Productivity tip</button>
            <button type="button" class="suggestion" data-message="Explain quantum computing like I'm five.">Explain quantum computing</button>
            <button type="button" class="suggestion" data-message="Help me plan a healthy dinner.">Plan a healthy dinner</button>
        </div>

        <form id="chatForm" class="chat-input" autocomplete="off">
            <label class="sr-only" for="userMessage">Message</label>
            <input id="userMessage" name="message" type="text" placeholder="Ask Nova anything…" required aria-required="true">
            <button type="submit" class="primary-button">Send</button>
        </form>
    </main>

    <template id="messageTemplate">
        <article class="message">
            <div class="message-meta">
                <span class="message-author"></span>
                <time class="message-time" aria-hidden="true"></time>
            </div>
            <p class="message-content"></p>
        </article>
    </template>

    <script>
        const chatLog = document.getElementById('chatLog');
        const chatForm = document.getElementById('chatForm');
        const userMessageInput = document.getElementById('userMessage');
        const messageTemplate = document.getElementById('messageTemplate');
        const suggestions = document.querySelectorAll('.suggestion');

        const conversationHistory = [];

        const knowledgeBase = [
            {
                keywords: ['hello', 'hi', 'hey', 'greetings'],
                responses: [
                    'Hey there! How can I brighten your day?',
                    'Hello! Ready to explore something new together?',
                    'Hi! What would you like to chat about?'
                ]
            },
            {
                keywords: ['time', 'date', 'day'],
                responder: () => {
                    const now = new Date();
                    const formatted = new Intl.DateTimeFormat([], {
                        weekday: 'long',
                        hour: 'numeric',
                        minute: '2-digit'
                    }).format(now);
                    return `It\'s ${formatted}. Plenty of time to learn something cool.`;
                }
            },
            {
                keywords: ['joke', 'laugh'],
                responses: [
                    'Why did the neural network take up meditation? To reduce its inner error.',
                    'I told a joke to an algorithm once. It didn\'t get it, but it tried to optimize its response anyway!',
                    'What do you call a robot who takes the scenic route? A detour-ministic system.'
                ]
            },
            {
                keywords: ['productivity', 'focus', 'motivation'],
                responses: [
                    'Try the 50/10 rhythm: work with full focus for 50 minutes, then give yourself 10 minutes to reset. Your brain will thank you.',
                    'A productivity boost tip: decide on the single most important outcome for the next hour, then block everything else until it\'s done.'
                ]
            },
            {
                keywords: ['quantum', 'physics'],
                responses: [
                    'Imagine classical bits as coins that are either heads or tails. Quantum bits are like coins spinning in the air—able to be a mix of both until observed.',
                    'Quantum computing lets us use superposition and entanglement to solve certain problems much faster than classical machines could dream of.'
                ]
            },
            {
                keywords: ['plan', 'dinner', 'meal', 'recipe'],
                responses: [
                    'How about grilled salmon with roasted vegetables and a quinoa salad? Balanced, bright, and quick to put together.',
                    'Consider a veggie stir-fry with tofu, bell peppers, snow peas, and a ginger soy glaze served over brown rice. Delicious and nourishing!'
                ]
            },
            {
                keywords: ['stressed', 'overwhelmed', 'anxious'],
                responses: [
                    'Take a gentle breath in for 4 counts, hold for 4, and exhale for 6. Let the nervous system settle, then we can plan your next step.',
                    'It\'s okay to feel overwhelmed. Let\'s break things into the smallest next action so it feels manageable.'
                ]
            }
        ];

        const fallbackResponses = [
            'That\'s fascinating. Tell me more so I can keep up with you.',
            'I\'m piecing that together—what outcome would make this feel like a win?',
            'Curious! I can help brainstorm, explain, or just listen. Where should we start?',
            'Let\'s explore that. What\'s the part you\'re most unsure about?'
        ];

        const contextualResponses = [
            (input) => {
                if (/(who|what) are you|your name/.test(input)) {
                    return 'I\'m Nova, a friendly AI buddy living entirely in your browser. I draw from patterns, context, and a splash of curiosity to respond.';
                }
                return null;
            },
            (input) => {
                if (/help|assist/.test(input)) {
                    return 'I\'m here to help! Ask me for explanations, brainstorming, daily planning, or just a thoughtful conversation.';
                }
                return null;
            },
            (input) => {
                const match = input.match(/define (.+)/);
                if (match) {
                    return `Let\'s break down “${match[1]}”. What about it has you curious?`;
                }
                return null;
            },
            (input) => {
                if (/thank/.test(input)) {
                    return 'Happy to help! If anything else pops up, I\'m just a message away.';
                }
                return null;
            },
            (input) => {
                if (/weather/.test(input)) {
                    return 'I don\'t have real-time weather data, but I can help you plan for a sunny, rainy, or cozy day regardless!';
                }
                return null;
            },
            (input) => {
                if (/idea|brainstorm/.test(input)) {
                    const topics = conversationHistory.slice(-3).map(item => item.text).join('; ');
                    return `Okay, let\'s ideate. From what I\'ve heard so far (${topics || 'just getting started'}), what would progress look like to you?`;
                }
                return null;
            }
        ];

        function addMessage(content, author) {
            const clone = messageTemplate.content.cloneNode(true);
            const article = clone.querySelector('.message');
            article.classList.add(author === 'Nova' ? 'message-ai' : 'message-user');

            const authorEl = clone.querySelector('.message-author');
            const timeEl = clone.querySelector('.message-time');
            const contentEl = clone.querySelector('.message-content');

            authorEl.textContent = author;
            contentEl.textContent = content;
            timeEl.textContent = new Intl.DateTimeFormat([], { hour: 'numeric', minute: '2-digit' }).format(new Date());

            chatLog.appendChild(clone);
            chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
        }

        function showTypingIndicator() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.setAttribute('role', 'status');
            typing.innerHTML = `<span></span><span></span><span></span>`;
            chatLog.appendChild(typing);
            chatLog.dataset.typing = 'true';
            chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
        }

        function removeTypingIndicator() {
            const typing = chatLog.querySelector('.typing-indicator');
            if (typing) {
                typing.remove();
            }
            delete chatLog.dataset.typing;
        }

        function randomItem(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function searchKnowledgeBase(input) {
            const lower = input.toLowerCase();
            for (const entry of knowledgeBase) {
                if (entry.keywords.some(keyword => lower.includes(keyword))) {
                    if (entry.responder) {
                        return entry.responder(lower);
                    }
                    return randomItem(entry.responses);
                }
            }
            return null;
        }

        function searchContextual(input) {
            for (const resolver of contextualResponses) {
                const result = resolver(input);
                if (result) {
                    return result;
                }
            }
            return null;
        }

        function craftAdaptiveResponse(input) {
            const summary = conversationHistory.slice(-2).map(item => item.text).join(' · ');
            const prompts = [
                `You mentioned ${summary || 'we just met'}—where should we go from here?`,
                `I\'m sensing a theme around ${extractTheme()} so far. Want to explore it deeper?`,
                'Give me a hint: are we problem-solving, learning, or just vibing right now?'
            ];
            return randomItem(prompts);
        }

        function extractTheme() {
            const text = conversationHistory.map(item => item.text).join(' ');
            if (!text) return 'curiosity';
            if (/work|project|deadline/.test(text)) return 'productivity';
            if (/learn|study|explain/.test(text)) return 'learning';
            if (/travel|adventure|trip/.test(text)) return 'travel ideas';
            if (/health|dinner|meal/.test(text)) return 'wellness';
            return 'whatever is on your mind';
        }

        function generateResponse(input) {
            const contextual = searchContextual(input);
            if (contextual) {
                return contextual;
            }

            const fromKnowledge = searchKnowledgeBase(input);
            if (fromKnowledge) {
                return fromKnowledge;
            }

            return craftAdaptiveResponse(input) || randomItem(fallbackResponses);
        }

        function handleUserMessage(message) {
            const trimmed = message.trim();
            if (!trimmed) {
                return;
            }
            conversationHistory.push({ author: 'You', text: trimmed });
            addMessage(trimmed, 'You');

            showTypingIndicator();

            setTimeout(() => {
                removeTypingIndicator();
                const response = generateResponse(trimmed);
                conversationHistory.push({ author: 'Nova', text: response });
                addMessage(response, 'Nova');
            }, 600 + Math.random() * 600);
        }

        chatForm.addEventListener('submit', event => {
            event.preventDefault();
            const value = userMessageInput.value;
            userMessageInput.value = '';
            handleUserMessage(value);
            userMessageInput.focus();
        });

        suggestions.forEach(button => {
            button.addEventListener('click', () => {
                userMessageInput.value = button.dataset.message;
                userMessageInput.focus();
            });
        });

        addMessage('Hi, I\'m Nova. Ask me anything and I\'ll do my best to help!', 'Nova');
    </script>
</body>
</html>
